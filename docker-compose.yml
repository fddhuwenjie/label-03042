version: '3.8'

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: scheduling-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: scheduling
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d scheduling"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scheduling-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scheduling-backend
    ports:
      - "8042:8042"
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: admin
      DB_PASSWORD: admin123
      DB_DATABASE: scheduling
      DB_SYNCHRONIZE: "true"  # 自动创建表结构，便于种子数据初始化
      JWT_SECRET: scheduling-jwt-secret-key-2024
      PORT: 8042
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scheduling-network
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scheduling-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - scheduling-network
    restart: unless-stopped

networks:
  scheduling-network:
    driver: bridge

volumes:
  postgres_data:
